<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Deck Builder</h1>
        <p class="subtitle">
            Paste your instructions and the raw data. The data does not need
            to be split by slide; it is structured into a deck automatically.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/generate" method="post">
            <div class="field">
                <label for="prompt">Instructions</label>
                <textarea id="prompt" name="prompt" rows="3" required
                    placeholder="e.g. Quarterly business review for the leadership team. Emphasize revenue growth and retention. Keep the tone direct."></textarea>
            </div>

            <div class="field">
                <label for="raw_data">Source data</label>
                <textarea id="raw_data" name="raw_data" rows="10" required
                    placeholder="Paste notes, numbers, transcripts, or any raw material here."></textarea>
            </div>

            <div class="row">
                <div class="field">
                    <label for="theme">Theme</label>
                    <select id="theme" name="theme">
                        {% for key in themes %}
                            <option value="{{ key }}" {% if key == default_theme %}selected{% endif %}>
                                {{ key | capitalize }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="field field-narrow">
                    <label for="accent_color">Accent color</label>
                    <input type="color" id="accent_color" name="accent_color" value="#2f5d8c">
                </div>

                <div class="field field-narrow">
                    <label for="target_slide_count">Slide count</label>
                    <input type="number" id="target_slide_count" name="target_slide_count" min="4" max="20" placeholder="auto">
                </div>
            </div>

            <div class="field">
                <label for="deck_title">Deck title (optional)</label>
                <input type="text" id="deck_title" name="deck_title" placeholder="Leave blank to let the deck title itself">
            </div>

            <button type="submit">Generate deck</button>
        </form>
    </main>
</body>
</html>
